workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 120
    environment:
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web app and sync Capacitor
        script: npm run build:android
      - name: Build Android App (APK)
        script: |
          cd android
          rm -rf gradle-8.10.2 gradle.zip
          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o gradle.zip
          unzip -qo gradle.zip
          chmod +x ./gradle-8.10.2/bin/gradle
          ./gradle-8.10.2/bin/gradle wrapper --gradle-version 8.10.2
          rm -rf gradle.zip gradle-8.10.2
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
