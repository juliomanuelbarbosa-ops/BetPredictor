workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 120
    environment:
      node: latest
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web app and sync Capacitor
        script: npm run build:android
      - name: Fix Gradle Wrapper
        script: |
          cd android
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
      - name: Build Android App (APK)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
