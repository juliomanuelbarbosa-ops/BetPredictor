workflows:
  android-debug:
    name: Build Debug APK
    max_build_duration: 30
    environment:
      java: 21
      android_signing:
        - keystore_reference  # remove this line if not signing
    scripts:
      - name: Set execute permission on gradlew
        script: chmod +x android/gradlew

      - name: Build Debug APK
        script: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - your@email.com  # replace with your email
        notify:
          success: true
          failure: true